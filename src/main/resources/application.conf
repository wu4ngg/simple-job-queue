ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [
      io.github.wu4ngg.simplejobqueue.ApplicationKt.module
    ]
  }
}
testReceiver {
     flakyReceiverFailureRate = 0.5
     flakyReceiverFailureRate = ${?FLAKY_RECEIVER_FAIL_RATE}
}
database {
    url = "jdbc:postgresql://127.0.0.1:5431/simple_job_queue"
    url = ${?DATABASE_URL}
    user = "app"
    user = ${?DATABASE_USER}
    password = "secret"
    password = ${?DATABASE_PASSWORD}
    maxPoolSize = 5
    maxPoolSize = ${?DATABASE_MAX_POOL_SIZE}
    connectionTimeout = 5000
    connectionTimeout = ${?DATABASE_CONNECTION_TIMEOUT}
}