services:
  db:
    image: postgres:17
    container_name: sjq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: simple_job_queue
    ports:
      - "127.0.0.1:5431:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d simple_job_queue" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
